# Nginx (roda no HOST, não em container).
# Copiar para /etc/nginx/sites-available/momentos e symlink em sites-enabled.
# Trocar SEUDOMINIO.com.br pelo domínio real ANTES de rodar o certbot.
#
# Este arquivo é HTTP puro (porta 80). O `certbot --nginx` injeta o bloco
# TLS (443 + certificados Let's Encrypt) automaticamente e cria o redirect 80->443.

# ---- Frontend (SPA/PWA Vue) ----
server {
    listen 80;
    server_name SEUDOMINIO.com.br www.SEUDOMINIO.com.br;

    root /var/www/momentos;
    index index.html;

    # PWA / SPA: rotas do Vue Router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache agressivo de assets versionados (Vite gera hash no nome)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ---- Backend (API NestJS no container, 127.0.0.1:3333) ----
server {
    listen 80;
    server_name api.SEUDOMINIO.com.br;

    # download de álbum em ZIP passa pela API; uploads vão direto p/ S3 (presigned)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # ZIP grande pode demorar
    }
}
