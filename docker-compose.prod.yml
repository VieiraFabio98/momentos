# Produção — Momentos no VPS (Hostinger)
# Sobe: Postgres (container, volume persistente) + API NestJS (container).
# Nginx + Certbot ficam no HOST (não neste compose) — ver DEPLOY-VPS.md.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Lê variáveis do arquivo .env na raiz (mesma pasta deste arquivo).

services:
  postgres:
    image: postgres:16-alpine
    container_name: momentos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # SEM 'ports': banco fica só na rede interna do compose, nunca exposto à internet.

  api:
    build: ./backend
    container_name: momentos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      # Só localhost do host — Nginx (host) faz o proxy. Não abre porta pública.
      - "127.0.0.1:3333:3333"

volumes:
  postgres_data:
